<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Sales Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Daily Sales Tracker</h1>
  <div class="card totals">
    <div><div class="label" id="dayLabel">Today</div><div class="big" id="dayTotal">₱0.00</div></div>
    <div><div class="label" id="monthLabel">This month</div><div class="big" id="monthTotal">₱0.00</div></div>
  </div>
  <div class="card">
    <div class="label" style="margin-bottom:6px">Add a sale (goes to today)</div>
    <form id="f">
      <input id="name" placeholder="Product name" required>
      <input id="price" type="number" step="0.01" min="0" placeholder="Price" required>
      <input id="qty" type="number" step="1" min="1" value="1" placeholder="Qty" required>
      <button type="submit">Add sale</button>
    </form>
  </div>
  <div class="card">
    <div class="label" style="margin-bottom:6px">Check another day</div>
    <div class="row">
      <input id="dayPick" type="date">
      <button id="todayBtn" type="button">Today</button>
    </div>
  </div>
  <div class="card table">
    <div class="label" id="listTitle" style="margin-bottom:6px">Sold today</div>
    <div id="list"></div>
  </div>
  <div class="card">
    <button id="finishBtn" type="button" class="finish">Finish day (close store)</button>
    <div id="summary"></div>
  </div>
  <div class="card table">
    <div class="row" style="margin-bottom:6px">
      <div class="label">Check a month</div>
      <input id="monthPick" type="month">
    </div>
    <div class="label" style="margin-bottom:6px">Tap a day to see what you sold</div>
    <div id="history"></div>
  </div>
</main>
<script src="script.js"></script>
</body>
</html>
